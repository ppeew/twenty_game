version: "3"

# 定义服务
services:
  admin_web:
    # 服务的镜像名称或镜像ID。如果镜像在本地不存在，Compose将会尝试拉取镜像
    image: admin_web:1.0
    # 构建镜像
    build:
      # 指定项目的地址
      context: /root/twenty_game/cmd/Game-admin_web
      # 指定Dockerfile
      dockerfile: Dockerfile
    ports:
      - 9007:9007
    volumes:
      - /root/game_log:/app/log
    privileged: true
    restart: always
    container_name: admin_web

